<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AgentDeck</title>
  <link rel="manifest" href="/static/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-canvas text-slate-100 select-none sm:select-auto">
  <!-- Toast 容器（下移避开顶部导航栏，杜绝遮挡） -->
  <div id="toast-container" class="fixed toast-safe-top right-3 left-3 sm:left-auto sm:w-80 z-50 space-y-1.5 pointer-events-none"></div>

  <!-- 整体双栏布局 -->
  <div class="flex h-[100dvh] w-full overflow-hidden relative">

    <!-- 移动端抽屉遮罩 -->
    <div id="sidebar-backdrop" onclick="window.appActions.toggleDrawer(false)"
      class="fixed inset-0 bg-black/65 z-30 hidden md:hidden backdrop-blur-xs"></div>

    <!-- 左侧边栏（参照 Antigravity-Deck：项目分组 + 最近对话） -->
    <aside id="sidebar-drawer"
      class="fixed md:static inset-y-0 left-0 z-40 w-[82vw] max-w-[300px] md:w-72 bg-slate-950 border-r border-slate-800/80 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out safe-top">

      <!-- 顶部品牌与新建按钮 -->
      <div class="h-12 px-3 border-b border-slate-800/80 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-6 h-6 rounded-md bg-sky-500/20 border border-sky-500/40 flex items-center justify-center text-sky-400 font-bold text-xs shrink-0">
            ⚡
          </div>
          <span class="font-bold text-sm tracking-tight truncate">AgentDeck</span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="window.appActions.openNewSessionModal()"
            class="px-2.5 py-1 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs transition active:scale-95">
            + 新对话
          </button>
          <button onclick="window.appActions.toggleSidebar()"
            class="hidden md:flex p-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-900 transition"
            title="收起侧边栏" aria-label="收起侧边栏">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <polyline points="14 9 11 12 14 15"></polyline>
            </svg>
          </button>
          <button onclick="window.appActions.toggleDrawer(false)"
            class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-200">
            ✕
          </button>
        </div>
      </div>

      <!-- Agent 类型筛选胶囊 -->
      <div class="px-2.5 py-2 flex items-center gap-1 overflow-x-auto no-scrollbar border-b border-slate-900 shrink-0">
        <button data-agent-tab="all" onclick="window.appActions.setFilter('all')"
          class="px-2 py-1 rounded-md bg-sky-500 text-slate-950 font-semibold text-[11px] shrink-0 transition">
          全部
        </button>
        <button data-agent-tab="agy_ide" onclick="window.appActions.setFilter('agy_ide')"
          class="px-2 py-1 rounded-md bg-slate-900 text-slate-300 hover:bg-slate-800 text-[11px] shrink-0 transition">
          IDE
        </button>
        <button data-agent-tab="agy_cli" onclick="window.appActions.setFilter('agy_cli')"
          class="px-2 py-1 rounded-md bg-slate-900 text-slate-300 hover:bg-slate-800 text-[11px] shrink-0 transition">
          AGY
        </button>
        <button data-agent-tab="claude_code" onclick="window.appActions.setFilter('claude_code')"
          class="px-2 py-1 rounded-md bg-slate-900 text-slate-300 hover:bg-slate-800 text-[11px] shrink-0 transition">
          Claude
        </button>
        <button data-agent-tab="opencode" onclick="window.appActions.setFilter('opencode')"
          class="px-2 py-1 rounded-md bg-slate-900 text-slate-300 hover:bg-slate-800 text-[11px] shrink-0 transition">
          OpenCode
        </button>
      </div>

      <!-- 搜索框 -->
      <div class="px-2.5 py-1.5 shrink-0">
        <input id="session-search-input" type="search" placeholder="搜索项目或对话..."
          class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800/90 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500/60" />
      </div>

      <!-- 分类滚动区（置顶 / 项目 Projects / 最近对话 Recent Conversations） -->
      <div id="session-list-container" class="flex-1 overflow-y-auto subtle-scrollbar px-2 py-1 space-y-3"></div>
    </aside>

    <!-- 右侧主工作台 -->
    <main class="flex-1 flex flex-col min-w-0 h-full bg-[#090d16] relative">

      <!-- 顶部导航栏（适配 safe-top，极简防遮挡布局） -->
      <header class="safe-top border-b border-slate-800/80 bg-slate-950/90 backdrop-blur shrink-0 z-20">
        <div class="h-12 px-2.5 sm:px-4 flex items-center justify-between gap-2">
          <!-- 左侧：抽屉汉堡按钮 / 桌面侧边栏展开按钮 + 精简会话标题 -->
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <button onclick="window.appActions.toggleDrawer()"
              class="md:hidden w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 text-slate-200 flex items-center justify-center shrink-0 active:scale-95"
              aria-label="打开菜单">
              ☰
            </button>
            <button id="desktop-sidebar-expand-btn" onclick="window.appActions.toggleSidebar()"
              class="hidden w-8 h-8 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-slate-100 items-center justify-center shrink-0 active:scale-95 transition"
              title="展开侧边栏" aria-label="展开侧边栏">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
                <polyline points="13 9 16 12 13 15"></polyline>
              </svg>
            </button>
            <div class="min-w-0 flex-1">
              <div id="current-session-title" class="text-xs sm:text-sm font-semibold text-slate-100 truncate flex items-center gap-1.5">
                加载中...
              </div>
              <div id="current-session-subtitle" class="text-[10px] text-slate-400 truncate font-mono">
                AgentDeck
              </div>
            </div>
          </div>

          <!-- 右侧：连接状态按钮 -->
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="window.appActions.openQrModal()"
              class="h-8 px-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 flex items-center gap-1.5 active:scale-95"
              title="扫码连接与状态">
              <div id="network-status-badge" class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              </div>
              <span>扫码</span>
            </button>
          </div>
        </div>
      </header>

      <!-- 断线重连提示 -->
      <div id="reconnect-banner"
        class="hidden px-3 py-1 bg-amber-500/15 border-b border-amber-500/30 text-amber-300 text-[11px] text-center shrink-0">
        🟡 重连同步中...
      </div>

      <!-- IDE 镜像提示 -->
      <div id="split-brain-banner"
        class="hidden px-3 py-1 bg-purple-500/15 border-b border-purple-500/30 text-purple-200 text-[11px] flex items-center justify-between shrink-0">
        <span class="truncate">🟣 IDE 实时镜像 · 发消息将自动克隆至 CLI 继续</span>
      </div>

      <!-- 全局待审批横幅 -->
      <div id="global-approval-banner" class="hidden shrink-0"></div>

      <!-- 对话卡片主视口 -->
      <div id="messages-container" class="flex-1 overflow-y-auto px-2.5 sm:px-5 py-3 scroll-smooth"></div>

      <!-- 滚到底部按钮 -->
      <button id="scroll-bottom-pill" onclick="window.appActions.scrollToBottom()"
        class="hidden absolute bottom-32 right-3 z-20 px-2.5 py-1 rounded-full bg-sky-500 text-slate-950 font-bold text-[11px] shadow-lg">
        ↓ 最新
      </button>

      <!-- 底部工具审批舱 -->
      <div id="bottom-approval-bar" class="hidden shrink-0 z-20"></div>

      <!-- 底部控制舱（参照 Antigravity-Deck：模型选择 + 模式选择 + 输入框） -->
      <footer class="border-t border-slate-800/90 bg-slate-950/95 px-2.5 sm:px-4 pt-2 safe-bottom shrink-0">
        <!-- 工具栏：模型选择 + 权限模式 -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1.5">
          <!-- 模型选择器 -->
          <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg px-2 h-7 shrink-0">
            <span class="text-[11px] mr-1">🧠</span>
            <select id="model-select" onchange="window.appActions.changeModel(this)"
              class="bg-transparent text-[11px] text-slate-200 font-medium focus:outline-none max-w-[145px] sm:max-w-[200px] truncate cursor-pointer">
              <option value="">默认模型</option>
            </select>
          </div>

          <!-- 执行策略选择器 -->
          <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg px-1.5 h-7 shrink-0">
            <select id="execution-mode-select" onchange="window.appActions.changeMode(this)"
              class="bg-transparent text-[11px] text-slate-200 font-medium focus:outline-none cursor-pointer">
              <option value="ask">🛡️ 审批</option>
              <option value="plan">📋 规划</option>
              <option value="accept_edits">✏️ 自动改</option>
              <option value="auto">⚡ 全自动</option>
            </select>
          </div>
        </div>

        <!-- 输入框与发送/中断按钮 -->
        <div class="flex items-end gap-1.5">
          <button id="abort-session-btn" onclick="window.appActions.abortSession()"
            class="hidden shrink-0 h-10 px-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center gap-1 shadow active:scale-95 transition">
            ⏹ 中断
          </button>

          <textarea id="prompt-input" rows="1"
            placeholder="发消息..."
            class="flex-1 max-h-28 min-h-[40px] px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500/70 resize-none"></textarea>

          <button onclick="window.appActions.sendPrompt()"
            class="shrink-0 h-10 px-3.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs sm:text-sm shadow active:scale-95 transition">
            发送
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- 模态框 1：手机扫码连接 & 状态 -->
  <div id="qr-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-2xl max-h-[88dvh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2.5 border-b border-slate-800 mb-3">
        <div class="font-bold text-sm">📱 扫码连接 & 状态</div>
        <button onclick="window.appActions.closeQrModal()" class="text-slate-400 hover:text-white px-2 py-0.5">✕</button>
      </div>
      <div id="qr-modal-body"></div>
    </div>
  </div>

  <!-- 模态框 2：新建对话 -->
  <div id="new-session-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-4 shadow-2xl space-y-2.5">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <div class="font-bold text-sm">+ 新建对话</div>
        <button onclick="window.appActions.closeNewSessionModal()" class="text-slate-400 hover:text-white px-2 py-0.5">✕</button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Agent</label>
          <select id="new-session-agent" onchange="window.appActions.onNewSessionAgentChange(this.value)"
            class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-100">
            <option value="agy_cli">Antigravity CLI</option>
            <option value="claude_code">Claude Code</option>
            <option value="opencode">OpenCode</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">权限模式</label>
          <select id="new-session-mode" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-100">
            <option value="ask">🛡️ 审批 (Ask)</option>
            <option value="accept_edits">✏️ 自动改 (Edit)</option>
            <option value="plan">📋 规划 (Plan)</option>
            <option value="auto">⚡ 全自动 (Auto)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[11px] text-slate-400 mb-1">模型</label>
        <select id="new-session-model" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-100"></select>
      </div>

      <div>
        <label class="block text-[11px] text-slate-400 mb-1">项目目录</label>
        <select id="new-session-workspace" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-100"></select>
      </div>

      <div>
        <label class="block text-[11px] text-slate-400 mb-1">自定义项目路径（可选）</label>
        <input id="new-session-custom-path" type="text" placeholder="d:/Development Files/..."
          class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-100 font-mono" />
      </div>

      <div>
        <label class="block text-[11px] text-slate-400 mb-1">首条指令（可选）</label>
        <textarea id="new-session-prompt" rows="2" placeholder="输入任务指令..."
          class="w-full px-2.5 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-100"></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-1">
        <button onclick="window.appActions.closeNewSessionModal()"
          class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs">取消</button>
        <button onclick="window.appActions.confirmCreateNewSession()"
          class="px-3.5 py-1.5 rounded-lg bg-sky-500 text-slate-950 font-bold text-xs">创建</button>
      </div>
    </div>
  </div>

  <!-- 模态框 3：本地 Markdown / 文档全屏阅读抽屉 -->
  <div id="doc-preview-modal" class="hidden fixed inset-0 z-50 bg-[#090d16]/95 backdrop-blur-md flex flex-col">
    <div class="safe-top border-b border-slate-800/90 bg-slate-950 px-3 sm:px-5 h-12 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <button onclick="window.appActions.closeDocModal()"
          class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 text-slate-200 flex items-center justify-center shrink-0 active:scale-95">
          ←
        </button>
        <div class="min-w-0 flex-1">
          <div id="doc-preview-title" class="text-xs sm:text-sm font-bold text-slate-100 truncate">文档阅读</div>
          <div id="doc-preview-path" class="text-[10px] font-mono text-slate-400 truncate"></div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="window.appActions.copyCurrentDocContent()"
          class="h-8 px-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-200 flex items-center gap-1 active:scale-95">
          📋 复制全文
        </button>
        <button onclick="window.appActions.closeDocModal()"
          class="h-8 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 active:scale-95">
          关闭
        </button>
      </div>
    </div>
    <div id="doc-preview-body" class="flex-1 overflow-y-auto px-3.5 sm:px-8 py-4 max-w-4xl w-full mx-auto safe-bottom"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
