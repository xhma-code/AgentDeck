[project]
name = "agentdeck"
version = "1.3.0"
description = "⚡ AgentDeck — 多项目 AI 研发异步编排驾驶舱与标准 MCP 协作中枢"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "watchfiles>=0.21.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "qrcode>=7.4.2",
    "pywebpush>=2.5.0",
    "mcp>=2.0.0",
]

[project.scripts]
agentdeck = "run:main"

[project.urls]
Homepage = "https://github.com/xhma-code/AgentDeck"
Documentation = "https://github.com/xhma-code/AgentDeck#readme"
Issues = "https://github.com/xhma-code/AgentDeck/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
